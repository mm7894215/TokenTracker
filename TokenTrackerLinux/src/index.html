<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TokenTracker</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 34rem;
        padding: 0 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        color: #94a3b8;
      }
      pre {
        margin: 1rem 0 0;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        background: #1e293b;
        color: #fca5a5;
        font-size: 0.8125rem;
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="loading">
        <h1>Starting TokenTracker…</h1>
        <p>The local dashboard will open automatically.</p>
      </div>
      <div id="error" hidden>
        <h1>TokenTracker could not start</h1>
        <p>The bundled dashboard server failed to launch.</p>
        <pre id="error-detail"></pre>
      </div>
    </main>
    <script>
      // The server is started on a worker thread so this page can paint
      // immediately; main.rs reports a failure through this event rather than
      // leaving the window stuck on the loading message forever.
      window.addEventListener('tokentracker:startup-error', (event) => {
        document.getElementById('loading').hidden = true;
        document.getElementById('error').hidden = false;
        // textContent, never innerHTML: the detail carries filesystem paths.
        document.getElementById('error-detail').textContent = String(event.detail ?? 'Unknown error');
      });
    </script>
  </body>
</html>
